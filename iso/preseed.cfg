#### TACISS automated Debian 13 (trixie) install ##############################
# Loaded from /cdrom/taciss/iso/preseed.cfg by the "TACISS server" boot entry.
# Questions still asked on purpose:
#   * which disk to erase (only when there is more than one candidate)
#   * the password for the "tacadmin" Linux account (never baked into the ISO)
# build-iso.sh appends mirror settings to this file for the netinst flavor.

### Locale / keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network: DHCP if available, otherwise carry on without a network
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 20
d-i netcfg/dhcpv6_timeout string 5
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Do not configure the network at this time
d-i netcfg/get_hostname string taciss
d-i netcfg/get_domain string
d-i netcfg/hostname string taciss
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Package sources: everything comes from the disc (works with no internet)
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/security_host string

### Accounts (no root login; tacadmin gets sudo, password asked at install)
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string TACISS Administrator
d-i passwd/username string tacadmin

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string America/Chicago
d-i clock-setup/ntp boolean true

### Disk: whole disk, one partition + swap. pick-disk.sh preselects the disk
### only if exactly one candidate exists (never the USB stick you booted from).
d-i partman/early_command string sh /cdrom/taciss/iso/pick-disk.sh
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

### Packages
d-i base-installer/install-recommends boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string python3 sqlite3 avahi-daemon libnss-mdns sudo curl ca-certificates
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Install TACISS, then reboot
d-i preseed/late_command string sh /cdrom/taciss/iso/late-command.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
