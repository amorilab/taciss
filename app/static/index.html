<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TACISS</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css?v=20">
<link rel="icon" href="/static/logo-32.png?v=5" sizes="32x32" type="image/png">
<link rel="icon" href="/static/logo-192.png?v=5" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/static/logo-192.png?v=5">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/dashboard">
    <img src="/static/logo-64.png?v=5" alt="" width="30" height="30">
    <span class="brand-text"><span id="site-name">TACISS</span><span id="site-program" class="brand-program" hidden></span></span>
  </a>
  <div class="clocks">
    <span id="clock-local">--:--:--</span>
    <span id="clock-utc" title="UTC / Zulu">--:--:--Z</span>
    <span id="wx-now" class="wx-now" hidden></span>
  </div>
  <div id="status-bar" class="status-bar lvl-normal">
    <span id="status-text">STATUS NORMAL</span>
    <span id="status-banner"></span>
    <span id="status-control"></span>
  </div>
  <div class="top-actions">
    <span id="conn" class="conn off" title="Live updates disconnected"></span>
    <button id="theme-btn" class="ghost" title="Toggle light/dark">◐</button>
    <div id="user-box"></div>
  </div>
</header>
<nav id="nav" class="nav"></nav>
<div id="ticker" class="ticker" hidden></div>
<main id="view" class="view"><p class="muted pad">Loading…</p></main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/app.js?v=24"></script>
<script src="/static/weather.js?v=7"></script>
<script src="/static/warroom.js?v=2"></script>
<script src="/static/mesh.js?v=4"></script>
<script src="/static/aprs.js?v=4"></script>
<script src="/static/meshcore.js?v=4"></script>
</body>
</html>
